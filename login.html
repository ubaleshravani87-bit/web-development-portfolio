<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">

    <!-- Left Branding -->
    <div class="auth-brand">
      <a href="index.html" class="logo">Your<span>Shravanii!!!!.</span></a>
      <h2>Welcome Back 👋</h2>
      <p>Login to access your personalized dashboard.</p>
      <ul class="auth-features">
        <li>✅ Secure JWT login</li>
        <li>✅ bcrypt password hashing</li>
        <li>✅ SQLite database</li>
      </ul>
    </div>

    <!-- Right Form -->
    <div class="auth-form-wrapper">
      <div class="auth-form-box">
        <h2>Sign In</h2>
        <p class="auth-sub">Enter your credentials to continue</p>

        <form id="loginForm" novalidate>
          <div class="input-group">
            <label for="loginEmail">Email Address</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="admin@portfolio.com"
              autocomplete="email"
              required>
          </div>

          <div class="input-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>
              <button type="button" class="toggle-password" data-target="loginPassword">👁</button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary auth-submit" id="loginBtn">
            Sign In
          </button>

          <p id="loginStatus" class="form-status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="register.html">Create one →</a>
        </p>

        <p class="auth-switch" style="margin-top: 10px;">
          <a href="index.html">← Back to portfolio</a>
        </p>
      </div>
    </div>

  </div>

  <!-- Login Script -->
  <script>
    const API_URL = 'http://localhost:5000/api';

    // Password toggle
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (target.type === 'password') {
          target.type = 'text';
          btn.textContent = '🙈';
        } else {
          target.type = 'password';
          btn.textContent = '👁';
        }
      });
    });

    // Load remembered email
    const remembered = localStorage.getItem('portfolio_remember');
    if (remembered) {
      document.getElementById('loginEmail').value = remembered;
      document.getElementById('rememberMe').checked = true;
    }

    // Handle login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;
      const status = document.getElementById('loginStatus');
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        status.textContent = '⚠ Please fill in all fields.';
        status.className = 'form-status error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      status.textContent = '';

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          status.textContent = `❌ ${data.message || 'Login failed'}`;
          status.className = 'form-status error';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        if (remember) {
          localStorage.setItem('portfolio_remember', email);
        } else {
          localStorage.removeItem('portfolio_remember');
        }

        localStorage.setItem('portfolio_token', data.token);
        localStorage.setItem('portfolio_user', JSON.stringify(data.user));

        status.textContent = `✅ Welcome back, ${data.user.name}! Redirecting...`;
        status.className = 'form-status success';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);

      } catch (error) {
        console.error(error);
        status.textContent = '❌ Cannot connect to server. Is backend running?';
        status.className = 'form-status error';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>

</body>
</html>
